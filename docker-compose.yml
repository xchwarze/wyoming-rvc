services:
  wyoming-rvc:
    build: .
    image: ghcr.io/xchwarze/wyoming-rvc:latest
    ports:
      - "127.0.0.1:8080:8080"   # HTTP debug API: no auth, local only (use "8080:8080" to expose it)
      - "10200:10200" # Wyoming (Home Assistant)
    volumes:
      - ./models:/models
      - ./config:/config   # optional voices.yaml for several voices
    env_file:
      - path: .env
        required: false
    environment:
      - DEVICE=${DEVICE:-cuda}
      - RVC_REPO_ID=${RVC_REPO_ID:-Slichi/KasaneTeto}
      - PIPER_VOICE=${PIPER_VOICE:-en_US-ljspeech-high}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 30s
    restart: unless-stopped
