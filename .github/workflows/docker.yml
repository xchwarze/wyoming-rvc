name: test-and-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Lint Home Assistant app (add-on)
        uses: frenck/action-app-linter@v2
        with:
          path: "./addon"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - gpu: cpu # CPU-only: ghcr.io/<owner>/wyoming-rvc-cpu
            suffix: "-cpu"
          - gpu: cuda # NVIDIA: ghcr.io/<owner>/wyoming-rvc
            suffix: ""
          - gpu: rocm # AMD: ghcr.io/<owner>/wyoming-rvc-rocm
            suffix: "-rocm"
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
    steps:
      # The GPU-enabled PyTorch layer is several GB (about 14 GB for ROCm); the default runner disk is tight.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: ${{ matrix.gpu == 'rocm' }}
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            GPU=${{ matrix.gpu }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      # Drop build state before smoke tests: PR images are loaded locally, other runs pull from GHCR.
      - name: Free build cache
        run: docker buildx prune --all --force

      - name: Smoke test image (CPU, no models)
        env:
          GPU: ${{ matrix.gpu }}
        run: |
          image="${IMAGE,,}:sha-${GITHUB_SHA::7}"
          docker run --rm -i --entrypoint python -e GPU "$image" - <<'PY'
          import os
          from importlib.metadata import requires, version

          import faiss
          import onnxruntime
          import piper
          import torch
          import transformers
          import wyoming
          from packaging.requirements import Requirement

          import wyoming_rvc.main
          from wyoming_rvc.config import Settings

          gpu = os.environ["GPU"]
          variants = {"cpu": "cpu", "cuda": "cu128", "rocm": "rocm7.2"}
          assert torch.__version__.split("+", 1)[1] == variants[gpu], torch.__version__
          assert (torch.version.cuda is not None) == (gpu == "cuda")
          assert (torch.version.hip is not None) == (gpu == "rocm")
          providers = onnxruntime.get_available_providers()
          assert ("CUDAExecutionProvider" in providers) == (gpu == "cuda"), providers
          assert Settings.from_env().device == ("cpu" if gpu == "cpu" else "cuda")
          for dependency in requires("wyoming-rvc"):
              requirement = Requirement(dependency)
              if requirement.marker is None or requirement.marker.evaluate({"extra": ""}):
                  assert version(requirement.name) in requirement.specifier, dependency
          print("imports and image profile ok", torch.__version__, providers)
          PY
          if [ "$GPU" = cpu ]; then
            docker run --rm --entrypoint python "$image" -m pip check
          fi
          docker run --rm --entrypoint python -e DEVICE=tpu "$image" -m wyoming_rvc.main && exit 1 || test $? -eq 2
