# Several RVC voices in one instance. Copy to /config/voices.yaml (Docker: ./config/voices.yaml;
# Home Assistant app: /addon_configs/<slug>_wyoming_rvc/voices.yaml).
# Every voice listed here is shown in Home Assistant; pick one per assistant.
# Models are downloaded at startup but loaded into VRAM on first use (LRU, RVC_MAX_LOADED_MODELS).
#
# Keys (all optional except repo_id, unless model_file is an absolute path):
#   name, language, repo_id, revision, model_file, index_file,
#   pitch (-24..24), index_rate (0..1), protect (0..0.5), f0_method (rmvpe),
#   enabled (default true), preload (load at startup, default false)
# Missing values fall back to the RVC_* / VOICE_LANGUAGE environment variables.
# Voice ids are lowercase (a-z 0-9 _ -); quote ids like "on" or "no", which YAML reads as booleans.

voices:
  teto:
    name: "Kasane Teto"
    language: "en"
    repo_id: "Slichi/KasaneTeto"
    pitch: 0
    index_rate: 0.6
    protect: 0.33
    preload: true

  # Replace with any Hugging Face repo holding an RVC .pth (and optional .index or a .zip).
  myvoice:
    name: "My Voice"
    language: "en"
    repo_id: "your-user/your-rvc-voice"
    model_file: "voice.pth"     # only if the repo has several .pth files
    index_file: "voice.index"   # only if it has several .index files
    pitch: 4
    enabled: false              # set to true once repo_id points to a real model

  # Local files: mount them and use absolute paths (no repo_id needed).
  # local:
  #   name: "Local Voice"
  #   model_file: "/models/my/voice.pth"
  #   index_file: "/models/my/voice.index"
