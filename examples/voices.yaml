# Several RVC voices in one instance. Without this file you get the built-in teto and miku.
# Copy to /config/voices.yaml (Docker: ./config/voices.yaml;
# Home Assistant app: /addon_configs/<slug>_wyoming_rvc/voices.yaml).
# Every voice listed here is shown in Home Assistant; pick one per assistant.
# Models are downloaded at startup but loaded into VRAM on first use (LRU, RVC_MAX_LOADED_MODELS).
#
# Keys (all optional except repo_id, unless model_file is an absolute path):
#   name, language, repo_id, revision, model_file, index_file,
#   pitch (-24..24), index_rate (0..1), protect (0..0.5), f0_method (rmvpe),
#   enabled (default true), preload (load at startup; if no voice sets it, the default voice is)
# Missing values fall back to the RVC_* / VOICE_LANGUAGE environment variables.
#
# Each voice may also pick its own TTS source (all optional; without them the voice uses the
# global SOURCE / PIPER_VOICE / WYOMING_UPSTREAM):
#   Piper (in-process):  piper_voice | piper_model (+ piper_config), piper_speaker_id,
#                        piper_length_scale, piper_noise_scale, piper_noise_w_scale
#   Any Wyoming TTS:     upstream (tcp://host:port; default: the global WYOMING_UPSTREAM),
#                        upstream_voice, upstream_speaker
#   source: piper|wyoming is inferred from the keys; set it only to reuse the global Piper
#   voice / upstream with different options. Do not mix piper_* and upstream* keys.
# A named piper_voice also sets the voice's language (en_GB-... -> en) unless 'language' is set.
# Voice ids are lowercase (a-z 0-9 _ -); quote ids like "on" or "no", which YAML reads as booleans.

voices:
  teto:
    name: "Kasane Teto"
    language: "en"
    repo_id: "Slichi/KasaneTeto"
    pitch: 0
    index_rate: 0.6
    protect: 0.33
    preload: true

  miku:
    name: "Hatsune Miku"
    repo_id: "binant/Hatsune_Miku__RVC_v2_"
    revision: "b05cba64eaa30f3bac39ff8ce7caff14a9af122b"   # pin a commit so the model cannot change
    pitch: 2

  # Replace with any Hugging Face repo holding an RVC .pth (and optional .index or a .zip).
  myvoice:
    name: "My Voice"
    language: "en"
    repo_id: "your-user/your-rvc-voice"
    model_file: "voice.pth"     # only if the repo has several .pth files
    index_file: "voice.index"   # only if it has several .index files
    pitch: 4
    enabled: false              # set to true once repo_id points to a real model

  # Local files: mount them and use absolute paths (no repo_id needed).
  # local:
  #   name: "Local Voice"
  #   model_file: "/models/my/voice.pth"
  #   index_file: "/models/my/voice.index"

  # Own Piper voice (male British English) feeding a local RVC model.
  # jarvis:
  #   name: "Jarvis"
  #   language: "en"
  #   piper_voice: en_GB-northern_english_male-medium
  #   model_file: "/config/models/jarvis/model.pth"
  #   index_file: "/config/models/jarvis/model.index"
  #   pitch: -6
  #   index_rate: 0.6
  #   protect: 0.33

  # Own upstream TTS (any Wyoming server) for this voice only.
  # kokoro_miku:
  #   repo_id: "binant/Hatsune_Miku__RVC_v2_"
  #   upstream: "tcp://kokoro:10200"
  #   upstream_voice: "af_heart"
